name: exam_maker_app
description: "تطبيق صناعة وأرشفة الاختبارات المدرسية وتصديرها بصيغة Word DOCX"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة والمسارات والتخزين
  provider: ^6.1.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # أذونات النظام في أندرويد
  permission_handler: ^11.3.1

  # اختيار الصور لشعار المدرسة والبسملة
  image_picker: ^1.1.2

  # بناء وضغط ملفات OpenXML (DOCX)
  archive: ^3.6.1
  xml: ^6.5.0

  # فتح المستند مباشرة في تطبيق Word المثبت على الهاتف
  open_filex: ^4.5.0

  # لتوليد معرفات فريدة للاختبارات
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # مجلد الأصول الافتراضية
  assets:
    - assets/images/

  # إعدادات الخطوط الرسمية
  fonts:
    - family: Traditional Arabic
      fonts:
        - asset: assets/fonts/Traditional_Arabic.ttf
        - asset: assets/fonts/Traditional_Arabic_Bold.ttf
          weight: 700
