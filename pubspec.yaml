name: exam_maker_app
description: "تطبيق صناعة وأرشفة الاختبارات المدرسية وتصديرها بصيغة Word DOCX"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة والمسارات والتخزين
  provider: ^6.1.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # أذونات النظام في أندرويد
  permission_handler: ^11.3.1

  # اختيار الصور لشعار المدرسة والبسملة
  image_picker: ^1.1.2

  # بناء وضغط ملفات OpenXML (DOCX)
  archive: ^3.6.1
  xml: ^6.5.0
  pdf: ^3.10.8
  printing: ^5.12.0

  # فتح المستند مباشرة في تطبيق Word المثبت على الهاتف
  open_filex: ^4.5.0

  # لتوليد معرفات فريدة للاختبارات
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # مجلد الأصول الافتراضية
  assets:
    - assets/images/

  # إعدادات الخطوط الرسمية
  fonts:
    # 1. عائلة خط الأميري
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Slanted.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldSlanted.ttf
          weight: 700
          style: italic

    # 2. عائلة خط سلطان
    - family: Sultan
      fonts:
        - asset: assets/fonts/Sultan-Medium.ttf
        - asset: assets/fonts/Sultan-bold.ttf
          weight: 700

    # 3. خط الثلث للعناوين
    - family: Thuluth
      fonts:
        - asset: assets/fonts/DTHULUTH-II-1.ttf

    # 4. خط زخارف البسملة
    - family: ZagharefBesm
      fonts:
        - asset: assets/fonts/zaghref-besm.ttf
