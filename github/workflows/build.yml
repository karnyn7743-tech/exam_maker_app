name: Build from ZIP
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest # أو windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          # على نظام Linux/Mac
          unzip -o project.zip -d ./build_dir
          # أو على Windows يمكن استخدام 7z x project.zip
          # أو PowerShell: Expand-Archive -Path project.zip -DestinationPath ./build_dir

      - name: Build application
        working-directory: ./build_dir
        run: |
