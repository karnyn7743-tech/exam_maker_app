workflows:
  android-release-build:
    name: Build Flutter Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2 # أو linux_x2 إذا كان حسابك مجانياً على لينكس
    environment:
      flutter: stable
      android_ndk: default
      java: 17
    scripts:
      - name: Flutter Clean
        script: |
          flutter clean

      - name: Flutter Pub Get
        script: |
          flutter pub get

      - name: Flutter Build Release APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation

    artifacts:
      - build/**/outputs/**/*.apk
