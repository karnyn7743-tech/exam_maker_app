name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read

# يمنع تكدس عمليات البناء لنفس الفرع؛ الأحدث يلغي الأقدم.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Clean Build Cache
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Patch Fluent Editor Touch Selection
        run: dart run tool/patch_fluent_editor.dart

      - name: Build Release APK
        run: flutter build apk --release --verbose

      # Compare the new APK certificate with the last successful APK artifact
      # before allowing an update package to be published.
      - name: Verify update signing certificate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_ARTIFACT_ID="14340395380"
          ARTIFACT_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREVIOUS_ARTIFACT_ID}/zip"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${ARTIFACT_URL}" \
            --output /tmp/previous-release-artifact.zip

          mkdir -p /tmp/previous-release
          unzip -q /tmp/previous-release-artifact.zip -d /tmp/previous-release

          PREVIOUS_APK="$(find /tmp/previous-release -type f -name '*.apk' -print -quit)"
          CURRENT_APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"

          if [ -z "${PREVIOUS_APK}" ] || [ -z "${APKSIGNER}" ]; then
            echo "::error::Could not inspect the previous APK signing certificate. No update APK will be published."
            exit 1
          fi

          PREVIOUS_CERT_OUTPUT="$("${APKSIGNER}" verify --print-certs "${PREVIOUS_APK}" 2>&1)"
          CURRENT_CERT_OUTPUT="$("${APKSIGNER}" verify --print-certs "${CURRENT_APK}" 2>&1)"

          echo "Previous APK certificate details:"
          printf '%s\\n' "${PREVIOUS_CERT_OUTPUT}"
          echo "Current APK certificate details:"
          printf '%s\\n' "${CURRENT_CERT_OUTPUT}"

          PREVIOUS_CERT="$(printf '%s\\n' "${PREVIOUS_CERT_OUTPUT}" | grep -Eo '[A-Fa-f0-9]{64}' | sed -n '1p' || true)"
          CURRENT_CERT="$(printf '%s\\n' "${CURRENT_CERT_OUTPUT}" | grep -Eo '[A-Fa-f0-9]{64}' | sed -n '1p' || true)"

          echo "Previous APK signer fingerprint: ${PREVIOUS_CERT}"
          echo "Current APK signer fingerprint:  ${CURRENT_CERT}"

          if [ -z "${PREVIOUS_CERT}" ] || [ "${PREVIOUS_CERT}" != "${CURRENT_CERT}" ]; then
            echo "::error::The signing certificate differs from the installed release. Do not install this APK over the existing app."
            exit 1
          fi

          echo "Signing certificate matches. The APK is eligible for an in-place update."

      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find build -type f -name "*.apk" -print

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-maker-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
