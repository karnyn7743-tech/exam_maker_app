name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read

# يمنع تكدس عمليات البناء لنفس الفرع؛ الأحدث يلغي الأقدم.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Clean Build Cache
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Patch Fluent Editor Touch Selection
        run: dart run tool/patch_fluent_editor.dart

      - name: Build Release APK
        run: flutter build apk --release --verbose

      # Build-validation artifact only. This APK uses the runner's debug signing key
      # and must not be installed over an existing release or distributed.
      - name: Verify and Rename APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find build -type f -name "*.apk" -print

          ORIGINAL_APK="build/app/outputs/flutter-apk/app-release.apk"
          FINAL_APK="build/app/outputs/flutter-apk/المحرر البسيط.apk"

          if [ ! -f "$ORIGINAL_APK" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi

          mv "$ORIGINAL_APK" "$FINAL_APK"

          echo "APK generated and renamed successfully:"
          ls -lh "$FINAL_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-maker-Android-APK-build-test-only
          path: build/app/outputs/flutter-apk/المحرر البسيط.apk
          retention-days: 30
