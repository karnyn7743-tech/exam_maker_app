name: Extract Flutter ZIP Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP into Repository Root
        run: |
          ZIP_FILE="flutter_project.zip"
          TEMP_DIR="/tmp/flutter_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          mkdir -p "$TEMP_DIR"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          COUNT=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)

          SOURCE_DIR="$TEMP_DIR"

          if [ "$COUNT" -eq 1 ]; then
            FIRST=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1)
            if [ -d "$FIRST" ]; then
              SOURCE_DIR="$FIRST"
            fi
          fi

          # Copy everything except GitHub workflows
          rsync -a \
            --exclude='.github/workflows/' \
            "$SOURCE_DIR"/ .

          # Remove uploaded ZIP
          rm -f "$ZIP_FILE"

      - name: Commit Extracted Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Flutter project excluding workflows"
            git push
          fi
