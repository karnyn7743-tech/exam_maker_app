name: exam_maker_app

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. جلب المكتبات والتحقق من المشروع
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء تطبيق APK بصيغة Release مع تجاوز قيود تدقيق إصدارات الأدوات
      - name: Build APK via Flutter
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 6. رفع ملف الـ APK الناتج لتنزيله مباشرة من تبويب Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-maker-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
