name: Generate Keystore
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Key
        run: |
          ARGS=(
            -genkeypair
            -v
            -keystore release-key.jks
            -keyalg RSA
            -keysize 2048
            -validity 10000
            -alias my-key
            -storepass "shaza24luqmaan14"
            -keypass "shaza24luqmaan14"
            -dname "CN=Developer, OU=Dev, O=App, L=City, S=State, C=YE"
            -noprompt
          )
          keytool "${ARGS[@]}"
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-file
          path: release-key.jks
